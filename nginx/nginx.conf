log_format upstream_hit_log '[$time_local] Client: $remote_addr | Request: "$request" | '
                            'Status: $status | Upstream Server: $upstream_addr | '
                            'Response Time: ${upstream_response_time}s';

upstream go_backend_cluster {
    server app1:8001 max_fails=2 fail_timeout=5s;
    server app2:8002 max_fails=2 fail_timeout=5s;
    server app3:8003 max_fails=2 fail_timeout=5s;
    server app4:8004 max_fails=2 fail_timeout=5s;
    server app5:8005 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/custom/nginx-balancer.log upstream_hit_log;
    error_log  /var/log/nginx/custom/nginx-error.log warn;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        proxy_pass http://go_backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 5;

        add_header X-Upstream-Addr $upstream_addr always;
    }
}
