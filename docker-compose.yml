services:
  app1:
    build: .
    container_name: go-app-1
    environment:
      - SERVER_NAME=app-1
      - PORT=8001
      - LOG_DIR=/app/logs
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - lb-net

  app2:
    build: .
    container_name: go-app-2
    environment:
      - SERVER_NAME=app-2
      - PORT=8002
      - LOG_DIR=/app/logs
    ports:
      - "8002:8002"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - lb-net

  app3:
    build: .
    container_name: go-app-3
    environment:
      - SERVER_NAME=app-3
      - PORT=8003
      - LOG_DIR=/app/logs
    ports:
      - "8003:8003"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - lb-net

  app4:
    build: .
    container_name: go-app-4
    environment:
      - SERVER_NAME=app-4
      - PORT=8004
      - LOG_DIR=/app/logs
    ports:
      - "8004:8004"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - lb-net

  app5:
    build: .
    container_name: go-app-5
    environment:
      - SERVER_NAME=app-5
      - PORT=8005
      - LOG_DIR=/app/logs
    ports:
      - "8005:8005"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - lb-net

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx/custom
    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5
    restart: unless-stopped
    networks:
      - lb-net

networks:
  lb-net:
    driver: bridge
